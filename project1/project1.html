<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="project1.css">
    <title>Count down</title>
</head>

<body>
    <main>
        <div class="container">
            <div class="left-container">
                <h1>New Years </h1>
                <div class="timer">
                    <div class="countdown days-c">
                        <p class="numbers">00</p>
                        <span>Days</span>
                    </div>
                    <div class="countdown hours-c">
                        <p class="numbers">00</p>
                        <span>Hours</span>
                    </div>
                    <div class="countdown minutes-c">
                        <p class="numbers">00</p>
                        <span>Minutes</span>
                    </div>
                    <div class="countdown seconds-c">
                        <p class="numbers">00</p>
                        <span>Seconds</span>
                    </div>
                </div>
                <div class="date-input">
                    <label>Date from</label>
                    <input type="date" class="date-inputs" id="date-from">
                    <label>Date to</label>
                    <input type="date" class="date-inputs" id="date-to">
                </div>
                <button id="submit-btn" class="countdown-btn">Start countdown</button>
            </div>
            <div class="right-container">
                <div class="picture">
                    <img src="./img/spinner.jpg" alt="progressbar">
                </div>
                <p class="text-p">We are getting there</p>
            </div>
        </div>
    </main>
    <script src="project1.js"></script>
</body>

</html>
